services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.base,Dockerfile.bamboo
    image: registry.agahyarai.local/dana-backend:latest
    container_name: dana-backend
    restart: unless-stopped
    ports:
      - "${DANA_PORT:-5900}:${DANA_PORT:-5800}"
    env_file:
      - .env
    environment:
      HOST_IP: ${HOST_IP:-}
    volumes:
      - upload_temp:/tmp/dana-uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    #   minio:
    #     condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://localhost:$${DANA_PORT}/chat/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: registry.agahyarai.local/postgres:16
    container_name: dana-backend-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: registry.agahyarai.local/rabbitmq:4.1-management
    container_name: dana-backend-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

